# The template of wrangler.toml. `npm run db:id` copies it to wrangler.toml, which git ignores: the copy
# holds this deployment's values (database id, client settings), so edit the copy, not this file.
name = "open-receptionist"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"

# Create the database once in the EU jurisdiction (set at creation only), then write its id here:
#   npx wrangler d1 create open-receptionist --jurisdiction eu
#   npm run db:id
# Then apply the schema with `npm run db:init` (wrangler d1 migrations apply).
[[d1_databases]]
binding = "DB"
database_name = "open-receptionist"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Non-secret, per-client values. Secrets (the *_API_KEY, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN and
# WEBHOOK_SECRET) are set with `npx wrangler secret put <NAME>`, never committed here.
[vars]
CLIENT_COMPANY = "Plomberie Dupont"
CLIENT_METIER = "plomberie"
CLIENT_HORAIRES = "du lundi au vendredi, de 8 h a 18 h"
CLIENT_TELEPHONE = "05 56 12 34 56"   # given to the caller in the confirmation SMS
CLIENT_ZONE = "Bordeaux, Mérignac, Pessac, Talence, Bègles, Le Bouscat"  # towns served; same list as infos.zone in config/client.json; empty = everywhere
CLIENT_TARIFS_URL = "https://plomberie-dupont.example/tarifs"  # optional: the published rates, linked in the confirmation SMS
TIME_ZONE = "Europe/Paris"
NOTIFY_EMAIL = "contact@plomberie-dupont.example"   # required: the email recap is the record of every call
NOTIFY_SMS = "06 12 34 56 78"         # optional: mobiles (06, 07) for the SMS recap, comma-separated
CONFIRM_CALLER_SMS = "true"           # "false" to stop texting the caller after a booking
CALCOM_EVENT_TYPE_ID = "123456"
MAIL_FROM = "Accueil <accueil@your-domain.example>"
SMS_SENDER = "Dupont"                 # the business's short name, 3 to 11 letters or digits, one letter at least; carriers filter "Info" or "Accueil"
# TRANSFER_HOURS = "lun-ven 8h-18h"  # when an emergency or a caller asking for a person is put through to transfert.numero (config/client.json); empty = any hour
# ALERT_EMAIL = "you@your-domain.example"  # who gets the daily report and the flood alert; defaults to the first NOTIFY_EMAIL
# SMS_COUNTRIES = "33"                # dialling codes that may receive an SMS (France only by default)
# RETENTION_DAYS = "365"              # records older than this are deleted every morning (30 to 1825)

# Call screening (docs/SETUP.md, step 5.4). Calls let through are counted per number, for withheld
# numbers and in total; beyond the limits, the caller is turned away before Vapi answers.
VAPI_ASSISTANT_ID = ""                # the assistant id printed in step 4.3; needed for screening method 2
# BLOCKED_NUMBERS = "06 00 00 00 01"  # comma-separated, refused outright
# SCREEN_PER_NUMBER_HOUR = "4"
# SCREEN_PER_NUMBER_DAY = "8"
# SCREEN_ANONYMOUS_HOUR = "5"         # withheld numbers, all together
# SCREEN_TOTAL_HOUR = "30"            # every caller together: bounds a flood from many numbers
# Only if Cal.com moves its API versions again (defaults: slots 2024-09-04, bookings 2026-02-25):
# CALCOM_SLOTS_API_VERSION = "2024-09-04"
# CALCOM_BOOKINGS_API_VERSION = "2026-02-25"

# The daily run: the check (configuration, the SMS key and credits, every delivery that failed in the
# last 24 hours, refused calls), emailed to ALERT_EMAIL when something is wrong, then the deletion of
# records older than RETENTION_DAYS. 06:00 UTC is 7 or 8 a.m. in Paris.
[triggers]
crons = ["0 6 * * *"]
